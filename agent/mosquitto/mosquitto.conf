# Broker MQTT di JARVIS (LAN). Autenticazione e permessi con il plugin dynamic-security:
# utenti, ruoli e default deny sono nel file dynamic-security.json (volume mqtt-data, non versionato).
# Configurazione e utenti: mosquitto/provision.sh e mosquitto/README.md.
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
